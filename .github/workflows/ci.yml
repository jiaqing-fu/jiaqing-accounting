name: CI

# 关于类型检查（typecheck job）：
# 原先本流水线没有类型检查，因为 uni-app 的 `// #ifdef` 条件编译对 tsc 而言只是注释，
# 同一文件里两个平台分支会被判定为「重复声明」，`tsc --noEmit` 与 `vue-tsc` 都必然失败。
# 现已把平台差异改为 `process.env.UNI_PLATFORM` 常量调度（uni-app 在构建时内联为字面量，
# 未命中分支被摇掉，效果等价于条件编译），类型检查因此可用。
#
# ⚠️ 这个 job 不是可有可无的。三端构建走的是 esbuild/vite，**只转译不做类型检查**，
# 实测把 `const x: number = "字符串"` 注入源码，两个 build 仍然全绿退出码 0。
# 也就是说没有这个 job，CI 全绿并不能说明代码类型是好的。
# 该门禁上线时即抓到 stats.vue 自项目首次提交起就存在的无限递归（币种符号渲染必崩）。
#
# 后端的类型检查由 build job 里的 `npm run build:server`（即 tsc）覆盖。
#
# runs-on 钉在 ubuntu-24.04 而非 ubuntu-latest：
# GitHub 于 2026-10-19 起把 ubuntu-latest 迁移到 Ubuntu 26，
# 钉版本可避免迁移当天构建莫名变红。升级是有意为之的动作，不是被动接受。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支有新推送时，取消仍在运行的旧任务，省额度也避免结论过期
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - name: 安装后端依赖
        run: npm ci
        working-directory: server

      - name: 后端单元测试
        run: npm test
        working-directory: server

  typecheck:
    name: 类型检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查
        run: npm run typecheck

  build:
    name: 构建验证
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 构建微信小程序
        run: npm run build:mp-weixin

      - name: 构建 H5（Electron 桌面端的前置产物）
        run: npm run build:h5

      - name: 安装后端依赖
        run: npm ci
        working-directory: server

      - name: 构建后端
        run: npm run build:server
